plugins { id 'com.android.application' }
android {
    namespace 'io.github.humdrfgry.unlockmusic'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.humdrfgry.unlockmusic.offline'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '0.2.2'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/offlineAssets'))
}
// Do not maintain a second copy of the web app inside Android sources.
def webPage = rootProject.file('../offline/index.html')
tasks.register('syncOfflineAssets', Copy) {
    from(webPage)
    into(layout.buildDirectory.dir('generated/offlineAssets'))
    doFirst {
        if (!webPage.exists()) throw new GradleException('Build offline/index.html first; see offline/README.md')
    }
}
tasks.named('preBuild').configure { dependsOn 'syncOfflineAssets' }

// Test-only dependencies do not become part of the offline APK.
dependencies {
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
